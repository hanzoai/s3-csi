name: "helm: lint and test charts"

# `main`, not `master`. This file came across from .github/workflows carrying
# upstream's branch name; this repo has no master, so the lane has never fired
# once — it produced no run to go red, which is why nobody noticed.
on:
  push:
    branches: [ main ]
    paths: ['deploy/helm/s3-csi/**']
  pull_request:
    branches: [ main ]
    paths: ['deploy/helm/s3-csi/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    # NOT ubuntu-latest. This fleet declares no ubuntu-* label on purpose, and an
    # unmatched label does not fail — it queues until the job timeout.
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.10.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1

      - name: Check if Chart version was updated
        if: github.event_name == 'pull_request'
        run: |
          # Get the base branch chart version
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:deploy/helm/s3-csi/Chart.yaml | grep '^version:' | awk '{print $2}')
          
          # Get the current chart version
          CURRENT_VERSION=$(grep '^version:' deploy/helm/s3-csi/Chart.yaml | awk '{print $2}')
          
          echo "Base version: $BASE_VERSION"
          echo "Current version: $CURRENT_VERSION"
          
          # Check if Helm files were changed
          HELM_FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c "^deploy/helm/" || echo "0")
          
          if [ "$HELM_FILES_CHANGED" -gt 0 ]; then
            if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then
              echo "::warning::Helm chart files were modified but Chart version was not updated!"
              echo "::warning::Please update the version in deploy/helm/s3-csi/Chart.yaml"
              echo "::warning::Current version: $CURRENT_VERSION"
            else
              echo "Chart version was updated from $BASE_VERSION to $CURRENT_VERSION"
            fi
          fi

      - name: Run chart-testing (lint)
        run: ct lint --all --validate-maintainers=false --chart-dirs deploy/helm/s3-csi/

      - name: Create kind cluster
        uses: helm/kind-action@v1.5.0

      - name: Run chart-testing (install)
        run: ct install --all --chart-dirs deploy/helm/s3-csi/
