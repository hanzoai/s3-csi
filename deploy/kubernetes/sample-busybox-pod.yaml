kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app
spec:
  containers:
    - name: my-frontend
      image: busybox
      volumeMounts:
        - mountPath: "/data"
          name: s3-volume
      command: [ "sleep", "1000000" ]
  volumes:
    - name: s3-volume
      persistentVolumeClaim:
        claimName: s3-csi-pvc
