kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-s3-controller
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-s3-controller
  serviceName: "csi-s3"
  replicas: 1
  template:
    metadata:
      labels:
        app: csi-s3-controller
        role: csi-s3
    spec:
      priorityClassName: system-cluster-critical
      serviceAccount: csi-s3-controller-sa
      containers:
        # provisioner
        - name: csi-provisioner
          image: k8s.gcr.io/sig-storage/csi-provisioner:v2.0.4
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: "Always"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        # attacher
        - name: csi-attacher
          image: k8s.gcr.io/sig-storage/csi-attacher:v3.0.2
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--timeout=120s"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: "Always"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        # Driver registrar
        - name: csi-driver-registrar
          image: quay.io/k8scsi/csi-cluster-driver-registrar:v1.0.1
          args:
            - "--v=5"
            - "--pod-info-mount-version=\"v1\""
            - "--csi-address=$(ADDRESS)"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        # S3 Plugin
        - name: s3-csi-plugin
          image: chrislusf/s3-csi:latest
          args :
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--filer=$(S3_FILER)"
            - "--nodeid=$(NODE_ID)"
            - "--cacheCapacityMB=$(S3_CACHE_CAPACITY_MB)"
            - "--cacheDir=$(S3_CACHE_DIR)"
            - "--map.uid=$(S3_MAP_UID)"
            - "--map.gid=$(S3_MAP_GID)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: S3_FILER
              value: "192.168.2.7:8888" # host and port of your S3 filer
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: S3_CACHE_CAPACITY_MB
              value: "1000"
            - name: S3_CACHE_DIR
              value: /tmp
            - name: S3_MAP_UID
              value: ""
            - name: S3_MAP_GID
              value: ""
          imagePullPolicy: "Always"
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-s3-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-s3-node
  template:
    metadata:
      labels:
        app: csi-s3-node
        role: csi-s3
    spec:
      priorityClassName: system-node-critical
      serviceAccount: csi-s3-node-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: driver-registrar
          image: k8s.gcr.io/sig-storage/csi-node-driver-registrar:v2.0.1
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/s3-csi/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi/
            - name: registration-dir
              mountPath: /registration/
        - name: csi-s3-plugin
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          image: chrislusf/s3-csi:latest
          args :
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--filer=$(S3_FILER)"
            - "--nodeid=$(NODE_ID)"
            - "--cacheCapacityMB=$(S3_CACHE_CAPACITY_MB)"
            - "--cacheDir=$(S3_CACHE_DIR)"
            - "--map.uid=$(S3_MAP_UID)"
            - "--map.gid=$(S3_MAP_GID)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: S3_FILER
              value: "192.168.2.7:8888" # host and port of your S3 filer, could also be K8S DNS entry like s3-filer.s3-namespace.svc:8888
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: S3_CACHE_CAPACITY_MB
              value: "1000"
            - name: S3_CACHE_DIR
              value: /tmp
            - name: S3_MAP_UID
              value: ""
            - name: S3_MAP_GID
              value: ""
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
            - mountPath: /dev
              name: device-dir
      volumes:
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/s3-csi
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
