---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "s3-csi.name" . }}-controller-sa
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{ .Values.imagePullSecrets | toYaml }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "s3-csi.name" . }}-node-sa
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{ .Values.imagePullSecrets | toYaml }}
{{- end }}
