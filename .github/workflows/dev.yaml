name: dev Docker images

on:
  push:
    branches: [master]

  # Build on PR
  pull_request:

  # Allow trigger for external PRs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta (csi-driver)
        id: docker_meta_csi
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/hanzoai/s3-csi
          tags: |
            type=raw,value=dev
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=s3-csi
            org.opencontainers.image.description=S3 is a distributed storage system for blobs, objects, files, and data lake, to store and serve billions of files fast!
            org.opencontainers.image.vendor=Chris Lu

      - name: Docker meta (mount-service)
        id: docker_meta_mount
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/hanzoai/s3-mount
          tags: |
            type=raw,value=dev
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=s3-mount
            org.opencontainers.image.description=S3 CSI mount helper service
            org.opencontainers.image.vendor=Chris Lu

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Get the current tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" | sed 's/\//_/g' >> $GITHUB_ENV

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: "--debug"

      # GHCR, not Docker Hub. This fork inherited a login as the upstream
      # author, so every build failed with "unauthorized: incorrect username or
      # password" — we do not have, and should not want, chrislusf's Docker Hub
      # token. GITHUB_TOKEN can push to this org's own registry, so the image
      # publishes with no secret to provision.
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build csi-driver image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          file: ./cmd/s3-csi/Dockerfile
          platforms: linux/amd64, linux/arm, linux/arm64, linux/386
          tags: ${{ steps.docker_meta_csi.outputs.tags }}
          labels: ${{ steps.docker_meta_csi.outputs.labels }}

      - name: Build mount-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          file: ./cmd/s3-mount/Dockerfile
          platforms: linux/amd64, linux/arm, linux/arm64, linux/386
          tags: ${{ steps.docker_meta_mount.outputs.tags }}
          labels: ${{ steps.docker_meta_mount.outputs.labels }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Helm check
        uses: igabaydulin/helm-check-action@0.1.4
        env:
          CHART_LOCATION: ./deploy/helm/s3-csi
          CHART_VALUES: ./deploy/helm/s3-csi/values.yaml
